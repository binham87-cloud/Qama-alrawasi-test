<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قمة الرواسي — نسخة العرض</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:Arial,sans-serif}
.wrap{max-width:700px;margin:auto;padding:15px 15px 80px}.demo{background:#78350f;color:#fde68a;text-align:center;padding:9px;font-size:12px;font-weight:bold}
h1{font-size:21px}.card{background:#151515;border:1px solid #292929;border-radius:12px;padding:14px;margin-bottom:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.label{color:#777;font-size:11px}.num{font-size:20px;font-weight:bold;margin-top:5px}
.green{color:#4ade80}.red{color:#f87171}.blue{color:#60a5fa}.purple{color:#c4b5fd}
.btn{border:0;border-radius:9px;padding:11px;font-weight:bold}.user{width:100%;margin:6px 0;background:#171717;color:white;border:1px solid #333;text-align:right}
.login{min-height:85vh;display:flex;align-items:center}.login>div{width:100%}.center{text-align:center}
input{width:100%;background:#191919;color:white;border:1px solid #333;border-radius:10px;padding:13px;text-align:center;font-size:22px;margin:10px 0}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex}
.nav button{flex:1;background:none;border:0;color:#777;padding:13px 3px}.nav button.on{color:white;background:#1d1d1d}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:#777;font-size:12px}
.badge{font-size:10px;border-radius:20px;padding:4px 7px}.paid,.approved{background:#052e16;color:#86efac}
.late,.rejected{background:#450a0a;color:#fca5a5}.vacant{background:#292524;color:#aaa}.pending{background:#422006;color:#fde68a}
.actions{display:flex;gap:6px;margin-top:10px}.ok{background:#14532d;color:#bbf7d0}.no{background:#450a0a;color:#fecaca}
.notice{background:#101827;border:1px solid #1e3a5f;color:#bfdbfe;border-radius:10px;padding:11px;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div id="app"></div>
<script>
const users={
 manager:{name:"المدير",role:"owner",icon:"👤"},
 yahia:{name:"يحيى",role:"employee",icon:"🔧"},
 nader:{name:"نادر",role:"employee",icon:"🔧"}
};

let state={user:null,selected:null,tab:"home"};

const data={
 units:[
  {name:"101/1",tenant:"مستأجر تجريبي",rent:2500,paid:2500,status:"paid"},
  {name:"101/2",tenant:"مستأجر تجريبي",rent:2300,paid:1000,status:"late"},
  {name:"101/3",tenant:"—",rent:2400,paid:0,status:"vacant"},
  {name:"202/1",tenant:"مستأجر تجريبي",rent:3000,paid:3000,status:"paid"},
  {name:"202/2",tenant:"مستأجر تجريبي",rent:2800,paid:0,status:"late"}
 ],
 requests:[
  {id:"R1",title:"مصروف مواد تنظيف",by:"يحيى",amount:450,status:"pending"},
  {id:"R2",title:"تعديل بيانات الوحدة 101/2",by:"نادر",amount:0,status:"pending"}
 ],
 bank:[
  {id:"BP-001",unit:"202/2",amount:1500,ref:"TEST-001",status:"approved"},
  {id:"BP-002",unit:"202/2",amount:1300,ref:"TEST-002",status:"pending"}
 ]
};

const money=n=>Number(n||0).toLocaleString("ar-AE")+" د.إ";
const statusName=s=>({paid:"مدفوع",late:"متأخر",vacant:"شاغر",
 approved:"معتمد",pending:"معلّق",rejected:"مرفوض"}[s]||s);

function login(){
 if(!state.selected){
  return `<div class="demo">نسخة عرض مجانية — بيانات وهمية ولا تتصل بـFirebase</div>
  <div class="wrap login"><div><div class="center"><h1>قمة الرواسي</h1>
  <p class="muted">اختر المستخدم لتجربة الواجهة</p></div>
  ${Object.entries(users).map(([k,u])=>`<button class="btn user" onclick="selectUser('${k}')">
  ${u.icon} &nbsp; ${u.name}<span class="muted" style="float:left">${u.role==="owner"?"مدير":"موظف"}</span></button>`).join("")}
  </div></div>`;
 }
 return `<div class="demo">نسخة عرض مجانية — لا تحفظ بيانات</div>
 <div class="wrap login"><div class="card center"><h2>${users[state.selected].icon} ${users[state.selected].name}</h2>
 <p style="color:#fbbf24;font-size:12px">PIN التجريبي: 0000</p>
 <input id="pin" maxlength="4" inputmode="numeric" placeholder="••••">
 <button class="btn" style="width:100%" onclick="enter()">دخول</button>
 <button class="btn user center" onclick="state.selected=null;render()">رجوع</button></div></div>`;
}

function totals(){
 const active=data.units.filter(x=>x.status!=="vacant");
 const target=active.reduce((s,x)=>s+x.rent,0);
 const collected=active.reduce((s,x)=>s+x.paid,0);
 return {target,collected,remaining:Math.max(0,target-collected),surplus:Math.max(0,collected-target)};
}

function home(){
 const t=totals();
 return `<div class="notice">هذه نسخة شكل وتجربة فقط. كل تغيير يختفي عند تحديث الصفحة ولا يصل إلى نظامك.</div><br>
 <div class="grid">
 ${card("المستهدف",money(t.target),"blue")}
 ${card("المحصّل",money(t.collected),"green")}
 ${card("المتبقي",money(t.remaining),"red")}
 ${card("الفائض",money(t.surplus),"purple")}
 </div><h3>الحسابات التجريبية</h3>
 <div class="grid">${card("الإيرادات",money(48200),"purple")}${card("الشركة",money(32500),"blue")}</div>`;
}

function card(label,value,color){
 return `<div class="card"><div class="label">${label}</div><div class="num ${color}">${value}</div></div>`;
}

function unitsPage(){
 return `<h3>الوحدات</h3>${data.units.map(x=>`<div class="card row">
 <div><b>${x.name}</b><div class="muted">${x.tenant}</div></div>
 <div style="text-align:left"><b>${money(x.paid)} / ${money(x.rent)}</b><br>
 <span class="badge ${x.status}">${statusName(x.status)}</span></div></div>`).join("")}`;
}

function requestsPage(){
 const owner=users[state.user].role==="owner";
 return `<div class="row"><h3>طلبات الاعتماد</h3>
 <button class="btn user" style="width:auto" onclick="addRequest()">+ طلب</button></div>
 ${data.requests.map(x=>`<div class="card">
 <div class="row"><div><b>${x.title}</b><div class="muted">بواسطة ${x.by} ${x.amount?"· "+money(x.amount):""}</div></div>
 <span class="badge ${x.status}">${statusName(x.status)}</span></div>
 ${owner&&x.status==="pending"?`<div class="actions">
 <button class="btn ok" onclick="decide('${x.id}','approved')">اعتماد</button>
 <button class="btn no" onclick="decide('${x.id}','rejected')">رفض</button></div>`:""}</div>`).join("")}`;
}

function bankPage(){
 return `<div class="row"><h3>الدفعات البنكية</h3>
 <button class="btn user" style="width:auto" onclick="addBank()">+ دفعة جزئية</button></div>
 <div class="notice">كل دفعة مستقلة برقم ومرجع وحالة، حتى لو كانت للوحدة نفسها.</div><br>
 ${data.bank.map(x=>`<div class="card row"><div><b>${x.id} · ${x.unit}</b>
 <div class="muted">المرجع: ${x.ref}</div></div><div style="text-align:left"><b>${money(x.amount)}</b><br>
 <span class="badge ${x.status}">${statusName(x.status)}</span></div></div>`).join("")}`;
}

function app(){
 const page=state.tab==="home"?home():state.tab==="units"?unitsPage():
 state.tab==="requests"?requestsPage():bankPage();
 return `<div class="demo">نسخة عرض — البيانات غير حقيقية</div><div class="wrap">
 <div class="row"><div><h1>قمة الرواسي</h1><div class="muted">${users[state.user].name}</div></div>
 <button class="btn user" style="width:auto" onclick="state.user=null;state.selected=null;render()">خروج</button></div>
 ${page}</div><div class="nav">
 <button class="${state.tab==="home"?"on":""}" onclick="go('home')">⌂<br>الرئيسية</button>
 <button class="${state.tab==="units"?"on":""}" onclick="go('units')">▦<br>الوحدات</button>
 <button class="${state.tab==="requests"?"on":""}" onclick="go('requests')">✓<br>الطلبات</button>
 <button class="${state.tab==="bank"?"on":""}" onclick="go('bank')">↔<br>البنك</button></div>`;
}

function selectUser(k){state.selected=k;render()}
function enter(){
 if(document.getElementById("pin").value!=="0000")return alert("PIN التجريبي هو 0000");
 state.user=state.selected;render();
}
function go(t){state.tab=t;render();scrollTo(0,0)}
function decide(id,s){const r=data.requests.find(x=>x.id===id);if(r)r.status=s;render()}
function addRequest(){data.requests.unshift({id:"R"+Date.now(),title:"طلب تجريبي جديد",by:users[state.user].name,amount:275,status:"pending"});render()}
function addBank(){data.bank.push({id:"BP-"+Date.now(),unit:"202/2",amount:500,ref:"TEST-"+Date.now(),status:"pending"});render()}
function render(){document.getElementById("app").innerHTML=state.user?app():login()}
render();
</script>
</body>
</html>
